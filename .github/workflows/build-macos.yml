name: Build macOS package (tkinter)

# Builds Beboputer.app + BeboputerInstaller.dmg by running
# bin/beboputer_tk/MAC_INSTALL/build_mac.sh on real macOS runners --
# PyInstaller does not cross-compile, so this can't happen on
# Linux/Windows runners (see that script's own header comment).
#
# Two runners are used to cover both current Mac CPU families:
#   macos-15-intel -> Intel   (x86_64) -- macos-13 (the previous Intel
#                      label) was fully retired by GitHub in December
#                      2025; macos-15-intel is the current replacement,
#                      supported until Apple/GitHub drop x86_64 macOS
#                      entirely (~Fall 2027). If a job using this label
#                      ever sits queued indefinitely again, check
#                      https://github.blog/changelog/ for a newer
#                      Intel-label migration -- same failure mode as
#                      this one.
#   macos-14       -> Apple Silicon (arm64)   ("macos-latest" also
#                      currently resolves to this, but pinned explicitly
#                      here so the matrix labels stay meaningful even
#                      after GitHub moves the alias)
# PyInstaller always builds for whatever architecture it's *running
# on* (the spec's target_arch=None means "native"), so this produces
# two separate, architecture-specific builds rather than one
# universal2 binary.
#
# Trigger: manually (Actions tab -> Run workflow), or automatically
# when a "v*" tag is pushed (e.g. v10.1.8) -- matching this repo's own
# version tags (see RELEASE_NOTES.md / bin/beboputer_v7/__init__.py).
#
# NOTE: the resulting .app/.dmg are NOT code-signed or notarized (that
# needs a paid Apple Developer ID and is out of scope here). A user
# opening the unsigned .app for the first time will see Gatekeeper's
# "unidentified developer" warning and needs to right-click -> Open
# (or System Settings -> Privacy & Security -> "Open Anyway") once.

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch_label: x86_64
          - runner: macos-14
            arch_label: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python (with tkinter)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify tkinter is importable
        # Fails fast with a clear message instead of a confusing
        # PyInstaller error deep into the build if this Python build
        # doesn't have a working Tcl/Tk -- mirrors build_mac.sh's own
        # check.
        run: python3 -c "import tkinter; print('tkinter OK:', tkinter.TkVersion)"

      - name: Install PyInstaller
        run: pip3 install pyinstaller

      - name: Build .app and .dmg
        run: bash bin/beboputer_tk/MAC_INSTALL/build_mac.sh

      - name: Read app version
        id: version
        run: |
          VERSION=$(python3 -c "import sys; sys.path.insert(0, 'bin'); from beboputer_v7 import __version__; print(__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Zip the .app (preserves bundle structure + exec bits)
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Beboputer.app "Beboputer-${{ steps.version.outputs.version }}-macos-${{ matrix.arch_label }}.app.zip"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Beboputer-${{ steps.version.outputs.version }}-macos-${{ matrix.arch_label }}-app
          path: dist/Beboputer-${{ steps.version.outputs.version }}-macos-${{ matrix.arch_label }}.app.zip
          if-no-files-found: error

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Beboputer-${{ steps.version.outputs.version }}-macos-${{ matrix.arch_label }}-dmg
          path: dist/BeboputerInstaller.dmg
          if-no-files-found: error

  release:
    # Only runs for an actual "v*" tag push, not manual workflow_dispatch
    # runs -- attaches both architectures' .dmg to a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # softprops/action-gh-release needs write access to create/update
      # a release and upload assets. The default GITHUB_TOKEN is
      # read-only unless a job explicitly requests write here -- without
      # this, the release step fails with "Resource not accessible by
      # integration" even though both build jobs succeed and produce
      # artifacts fine (that failure mode, seen on the first real run of
      # this workflow: build succeeded, only this last step needed it).
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach .dmg files to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/BeboputerInstaller.dmg
          fail_on_unmatched_files: true
